dataset:
  type: "augmented_plate"  # 使用增强版数据集
  data_name: "plate-train"
  data_dir: "data"
  batch_size: 32  # 减小batch_size以匹配原始实现
  num_workers: 4
  shuffle: true
  use_split_folders: false
  use_preprocessing: true  # 启用预处理
  
  # 多重裁剪增强配置
  use_crop_augmentation: true  # 启用多重裁剪增强
  crop_steps: 5               # 裁剪步长（每5像素一个裁剪尺寸）
  max_crop_ratio: 0.33        # 最大裁剪比例（1/3）
  quadrant_split: true        # 启用四象限分割

# 数据集文件夹结构说明：
# 当 use_split_folders: true 时，期望的文件夹结构为：
# data/plate/
# ├── train/
# │   ├── clean_dish/
# │   │   ├── image1.jpg
# │   │   └── image2.jpg
# │   └── dirty_dish/
# │       ├── image1.jpg
# │       └── image2.jpg
# ├── val/
# │   ├── clean_dish/
# │   └── dirty_dish/
# └── test/
#     ├── image1.jpg      
#     ├── image2.jpg      
#     └── ...

# 使用说明：
# 1. 对于简单的训练/测试分割，使用 dataset 配置即可
# 2. 对于需要明确控制训练/验证/测试数据集的情况，可以分别使用
  train_ratio: 0.8  # 训练集占总数据的比例, 当use_split_folders: true时，train_ratio无效
  transforms:
    resize: [224, 224]  # 调整图像大小为224x224
    center_crop: 224    # 可选的中心裁剪
    
    # 高级数据增强配置
    random_perspective:
      enable: true
      distortion_scale: 0.09
      p: 0.75
    
    color_jitter:
      enable: true
      brightness: 0.2
      contrast: 0.2
      saturation: 0.1
      hue: [-0.5, 0.5]  # 更强的色调变化
    
    horizontal_flip: true
    vertical_flip: true  # 启用垂直翻转
    rotation: 0
    
    normalize:
      mean: [0.485, 0.456, 0.406]  # ImageNet预训练模型的标准均值
      std: [0.229, 0.224, 0.225]   # ImageNet预训练模型的标准差 